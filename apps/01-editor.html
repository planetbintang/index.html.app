<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
      .wrap { max-width: 980px; margin: 32px auto; padding: 20px; }
      .card { background: rgba(15,23,42,0.8); border: 1px solid rgba(148,163,184,0.2); border-radius: 16px; padding: 20px; }
      textarea { width: 100%; min-height: 320px; background: #020817; color: #e5e7eb; border: 1px solid rgba(148,163,184,0.2); border-radius: 10px; padding: 14px; font-family: Consolas, monospace; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
      a { color: #7dd3fc; text-decoration: none; }
      button { background: #1d4ed8; color: white; border: none; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <h2>Editor Teks</h2>
        <a href="../index.html">← Kembali ke AppHub</a>
      </div>
      <div class="card">
        <textarea id="content"># AppHub Editor
Selamat datang di editor teks.

- Edit file ini
- Simpan ke browser
- Gunakan untuk catatan dan kode</textarea>
        <div style="margin-top: 14px;">
          <button onclick="saveText()">Simpan</button>
        </div>
      </div>
    </div>
    <script>
      function saveText() {
        const value = document.getElementById('content').value;
        localStorage.setItem('mini-editor', value);
        alert('Teks tersimpan di browser');
      }
      const saved = localStorage.getItem('mini-editor');
      if (saved) document.getElementById('content').value = saved;
    </script>
  </body>
</html>
