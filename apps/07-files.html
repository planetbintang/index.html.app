<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Manager</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(840px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:20px; }
      .files { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
      .file { background:#111827; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:14px; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>File Manager</h2>
      <div class="files">
        <div class="file">📄 index.html</div>
        <div class="file">📁 apps/</div>
        <div class="file">📦 assets/</div>
        <div class="file">📝 notes.txt</div>
        <div class="file">🗃️ data.json</div>
        <div class="file">⚙️ settings.ini</div>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
