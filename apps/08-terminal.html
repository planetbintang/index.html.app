<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Consolas, monospace; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(820px,90vw); background:#0b1220; border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:16px; }
      .screen { background:#020817; border-radius:10px; padding:16px; min-height: 240px; font-size: 0.95rem; line-height: 1.7; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="screen">
        <div>root@system:~$ ls</div>
        <div>apps  index.html  notes.txt</div>
        <div>root@system:~$ node --version</div>
        <div>v20.x</div>
        <div>root@system:~$ _</div>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
