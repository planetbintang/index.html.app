<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musik</title>
    <style>
      body { margin:0; display:grid; place-items:center; min-height:100vh; background:linear-gradient(135deg,#0f172a,#1d4ed8); color:#fff; font-family:Arial; }
      .box { background: rgba(15,23,42,0.7); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:20px; text-align:center; }
      .disk { width:150px; height:150px; border-radius:50%; background:radial-gradient(circle, #1e3a8a 0%, #020817 40%, #111827 100%); margin: 0 auto 18px; border: 10px solid rgba(148,163,184,0.2); }
      button { background:#2563eb; border:none; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="disk"></div>
      <h2>Now Playing</h2>
      <p>Project Horizon</p>
      <button>▶ Play</button>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
