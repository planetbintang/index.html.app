<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(800px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:20px; }
      .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
      .item { background:#111827; border:1px solid rgba(148,163,184,0.2); border-radius:12px; height:140px; display:grid; place-items:center; font-size:2.5rem; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Galeri</h2>
      <div class="grid">
        <div class="item">🌅</div>
        <div class="item">🌙</div>
        <div class="item">🌍</div>
        <div class="item">🚀</div>
        <div class="item">📷</div>
        <div class="item">🎨</div>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
