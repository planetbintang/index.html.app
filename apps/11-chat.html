<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(720px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      .msg { background:#111827; border-radius:10px; padding:10px; margin:8px 0; }
      .me { text-align:right; background:#1d4ed8; }
      input { width: 78%; padding: 10px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.2); background:#0f172a; color:#fff; }
      button { padding:10px 14px; border:none; border-radius:10px; background:#2563eb; color:#fff; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Chat</h2>
      <div class="msg">Halo! Saya bot mini.</div>
      <div class="msg me">Selamat datang di AppHub.</div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <input id="chatInput" placeholder="Ketik pesan..." />
        <button onclick="addReply()">Kirim</button>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function addReply(){ const input = document.getElementById('chatInput'); if(!input.value.trim()) return; const box = document.createElement('div'); box.className='msg me'; box.textContent = input.value; document.querySelector('.box').insertBefore(box, document.querySelector('p')); input.value=''; }
    </script>
  </body>
</html>
