<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(760px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      textarea { width:100%; min-height:100px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:12px; }
      button { background:#2563eb; border:none; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Translator</h2>
      <textarea id="in">Hello world</textarea>
      <div style="margin:10px 0;"><button onclick="translate()">Terjemahkan</button></div>
      <textarea id="out">Halo dunia</textarea>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function translate(){ const val = document.getElementById('in').value; document.getElementById('out').value = val === 'Hello world' ? 'Halo dunia' : 'Terjemahan demo: ' + val; }
    </script>
  </body>
</html>
