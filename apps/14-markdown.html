<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(820px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      textarea, .preview { width:100%; min-height:160px; background:#0f172a; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:12px; color:#fff; }
      .preview { margin-top:12px; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Markdown Preview</h2>
      <textarea id="md"># Judul\n\n**tebal** dan *miring*.</textarea>
      <div class="preview" id="out"></div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      const md = document.getElementById('md');
      const out = document.getElementById('out');
      md.addEventListener('input', () => {
        out.innerHTML = md.value
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/# (.*)/g, '<h3>$1</h3>')
          .replace(/\n/g, '<br>');
      });
      md.dispatchEvent(new Event('input'));
    </script>
  </body>
</html>
