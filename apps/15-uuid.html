<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UUID</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(600px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      #value { width:100%; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:12px; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>UUID Generator</h2>
      <input id="value" readonly />
      <div style="margin-top:12px;"><button onclick="generate()">Generate</button></div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function generate() {
        const uid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        document.getElementById('value').value = uid;
      }
      generate();
    </script>
  </body>
</html>
