<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Generator</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(520px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; text-align:center; }
      .qr { width:200px; height:200px; background: linear-gradient(45deg,#f8fafc,#94a3b8); margin:16px auto; border-radius:16px; display:grid; place-items:center; font-size:3rem; }
      input { width:100%; padding:10px; border-radius:10px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>QR Generator</h2>
      <div class="qr">📱</div>
      <input id="qrData" value="https://github.com/sumberkode" />
      <p><button onclick="document.querySelector('.qr').textContent='✅'">Generate</button></p>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
