<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(760px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      canvas { width:100%; height:290px; background:#fff; border-radius:10px; border:1px solid #cbd5e1; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Paint Mini</h2>
      <canvas id="paint" width="700" height="260"></canvas>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      const c = document.getElementById('paint'); const ctx = c.getContext('2d');
      let drawing = false;
      ctx.lineWidth = 4; ctx.lineJoin='round'; ctx.lineCap='round';
      c.addEventListener('pointerdown', e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
      c.addEventListener('pointermove', e => { if(!drawing) return; ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke(); });
      c.addEventListener('pointerup', () => drawing = false);
      c.addEventListener('pointerleave', () => drawing = false);
    </script>
  </body>
</html>
