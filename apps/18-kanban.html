<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .board { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:min(920px,90vw); }
      .col { background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:14px; }
      .card { background:#111827; border-radius:10px; padding:12px; margin-top:10px; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="col"><h3>Todo</h3><div class="card">Buat prototipe</div><div class="card">Review UI</div></div>
      <div class="col"><h3>Doing</h3><div class="card">Integrasi data</div></div>
      <div class="col"><h3>Done</h3><div class="card">Landing page</div><div class="card">Dashboard</div></div>
    </div>
    <p style="text-align:center;"><a href="../index.html">← Kembali</a></p>
  </body>
</html>
