<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <style>
      body { margin: 0; background: #020817; color: #e2e8f0; font-family: Arial; display: grid; place-items: center; min-height: 100vh; }
      .box { background: rgba(15,23,42,0.8); border: 1px solid rgba(148,163,184,0.2); border-radius: 16px; padding: 22px; text-align: center; }
      #display { font-size: 3rem; font-weight: 700; margin: 16px 0; }
      button { padding: 10px 16px; border: none; border-radius: 10px; background: #2563eb; color: white; cursor:pointer; margin: 0 4px; }
      a { color: #7dd3fc; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Stopwatch</h2>
      <div id="display">00:00:00</div>
      <button onclick="startStopwatch()">Start</button>
      <button onclick="pauseStopwatch()">Pause</button>
      <button onclick="resetStopwatch()">Reset</button>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      let timer = null; let elapsed = 0;
      function render(){ const h = String(Math.floor(elapsed / 3600)).padStart(2,'0'); const m = String(Math.floor((elapsed % 3600)/60)).padStart(2,'0'); const s = String(elapsed % 60).padStart(2,'0'); document.getElementById('display').textContent = `${h}:${m}:${s}`; }
      function startStopwatch(){ if(timer) return; timer = setInterval(() => { elapsed++; render(); }, 1000); }
      function pauseStopwatch(){ if(timer){ clearInterval(timer); timer=null; } }
      function resetStopwatch(){ pauseStopwatch(); elapsed = 0; render(); }
      render();
    </script>
  </body>
</html>
