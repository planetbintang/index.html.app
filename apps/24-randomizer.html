<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randomizer</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(560px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:20px; }
      #result { font-size: 2.2rem; font-weight: 700; text-align: center; margin: 18px 0; }
      .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
      input { padding:10px; background:#0f172a; color:#fff; border: 1px solid rgba(148,163,184,0.2); border-radius: 10px; }
      button { padding:10px 14px; background:#2563eb; color:#fff; border:none; border-radius:10px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Randomizer</h2>
      <div id="result">--</div>
      <div class="controls">
        <input id="min" type="number" value="1" />
        <input id="max" type="number" value="100" />
        <button onclick="roll()">Roll</button>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function roll(){ const min = Number(document.getElementById('min').value) || 1; const max = Number(document.getElementById('max').value) || 100; const value = Math.floor(Math.random()*(max-min+1))+min; document.getElementById('result').textContent = value; }
      roll();
    </script>
  </body>
</html>
