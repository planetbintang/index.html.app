<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Picker</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(560px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      input[type=color] { width:100%; height:90px; border:none; background:transparent; }
      #swatch { width:100%; height:120px; border-radius:10px; margin-top:12px; border:1px solid rgba(148,163,184,0.2); }
      #code { font-size:1.2rem; font-weight:700; margin:12px 0; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Color Picker</h2>
      <input id="picker" type="color" value="#2563eb" />
      <div id="swatch"></div>
      <div id="code">#2563eb</div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      const picker = document.getElementById('picker'); const swatch = document.getElementById('swatch'); const code = document.getElementById('code');
      function sync(){ const color = picker.value; swatch.style.background = color; code.textContent = color; }
      picker.addEventListener('input', sync); sync();
    </script>
  </body>
</html>
