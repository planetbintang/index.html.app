<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Viewer</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(780px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      textarea { width:100%; min-height:200px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:12px; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      pre { background:#0f172a; border-radius:10px; padding:12px; overflow:auto; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>JSON Viewer</h2>
      <textarea id="json">{"name":"AppHub","version":"1.0","modules":["editor","timer","calendar"]}</textarea>
      <div style="margin-top:12px; "><button onclick="formatJson()">Format</button></div>
      <pre id="out"></pre>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function formatJson(){ try { const obj = JSON.parse(document.getElementById('json').value); document.getElementById('out').textContent = JSON.stringify(obj, null, 2); } catch { document.getElementById('out').textContent = 'JSON tidak valid'; } }
      formatJson();
    </script>
  </body>
</html>
