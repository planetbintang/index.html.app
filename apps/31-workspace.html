<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(820px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
      .card { background:#111827; border:1px solid rgba(148,163,184,0.2); border-radius:12px; padding:18px; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Workspace</h2>
      <div class="grid">
        <div class="card">📁 Project</div>
        <div class="card">📄 Notes</div>
        <div class="card">🧪 Test</div>
        <div class="card">📊 Analytics</div>
        <div class="card">🚀 Deploy</div>
        <div class="card">⚙️ Settings</div>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
