<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lottery</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(560px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:22px; text-align:center; }
      .balls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:16px 0; }
      .ball { width:42px; height:42px; border-radius:50%; background:#1d4ed8; display:grid; place-items:center; font-weight:700; }
      button { padding:10px 14px; background:#2563eb; color:#fff; border:none; border-radius:10px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Lottery</h2>
      <div class="balls" id="balls"></div>
      <button onclick="draw()">Draw</button>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function draw(){ const nums = Array.from({ length: 6 }, () => Math.floor(Math.random() * 49) + 1); const el = document.getElementById('balls'); el.innerHTML = nums.map(n => `<div class="ball">${n}</div>`).join(''); }
      draw();
    </script>
  </body>
</html>
