<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speech</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(620px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:20px; }
      textarea { width:100%; min-height:120px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:12px; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Speech Text</h2>
      <textarea id="text">Halo, ini adalah demo speech text.</textarea>
      <div style="margin-top:12px;"><button onclick="speak()">Bicara</button></div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function speak(){ const speech = new SpeechSynthesisUtterance(document.getElementById('text').value); speech.lang = 'id-ID'; window.speechSynthesis.cancel(); window.speechSynthesis.speak(speech); }
    </script>
  </body>
</html>
