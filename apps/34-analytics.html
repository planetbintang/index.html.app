<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(760px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
      .stat { background:#111827; padding:14px; border-radius:10px; text-align:center; border:1px solid rgba(148,163,184,0.2); }
      .big { font-size:1.7rem; font-weight:700; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Analytics</h2>
      <div class="stats">
        <div class="stat"><div>Users</div><div class="big">1432</div></div>
        <div class="stat"><div>Clicks</div><div class="big">8260</div></div>
        <div class="stat"><div>Sales</div><div class="big">87%</div></div>
        <div class="stat"><div>Uptime</div><div class="big">99.9%</div></div>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
