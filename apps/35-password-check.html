<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Checker</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(540px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      input { width:100%; padding:12px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      .score { margin-top:18px; font-weight:700; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Password Checker</h2>
      <input id="pw" value="Passw0rd!" placeholder="Masukkan password" />
      <div style="margin-top:12px;"><button onclick="check()">Check</button></div>
      <div class="score" id="score">Skor: 0</div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function check(){ const p = document.getElementById('pw').value; let score = 0; if(p.length >= 8) score += 25; if(/[A-Z]/.test(p)) score += 25; if(/[0-9]/.test(p)) score += 25; if(/[!@#$%^&*]/.test(p)) score += 25; document.getElementById('score').textContent = 'Skor: ' + score + '%'; }
      check();
    </script>
  </body>
</html>
