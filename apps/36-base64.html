<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base64</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(700px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      textarea { width:100%; min-height:110px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:12px; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Base64 Tool</h2>
      <textarea id="input">AppHub</textarea>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;"><button onclick="encodeIt()">Encode</button><button onclick="decodeIt()">Decode</button></div>
      <textarea id="output" style="margin-top:12px;">QXBwSHVi</textarea>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function encodeIt(){ document.getElementById('output').value = btoa(unescape(encodeURIComponent(document.getElementById('input').value))); }
      function decodeIt(){ document.getElementById('output').value = decodeURIComponent(escape(atob(document.getElementById('input').value))); }
    </script>
  </body>
</html>
