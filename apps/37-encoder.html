<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encoder</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(700px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      textarea { width:100%; min-height:130px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; padding:12px; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Text Encoder</h2>
      <textarea id="input">hello</textarea>
      <div style="margin-top:12px;"><button onclick="encodeHex()">Hex Encode</button></div>
      <textarea id="output" style="margin-top:12px;">68656c6c6f</textarea>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function encodeHex(){ const text = document.getElementById('input').value; document.getElementById('output').value = Array.from(text).map(ch => ch.charCodeAt(0).toString(16).padStart(2,'0')).join(''); }
    </script>
  </body>
</html>
