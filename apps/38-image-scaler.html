<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Resizer</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(620px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      input { width:100%; padding:10px; background:#0f172a; color:#fff; border:1px solid rgba(148,163,184,0.2); border-radius:10px; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      .preview { width:100%; background:#111827; min-height:130px; border:1px solid rgba(148,163,184,0.2); border-radius:10px; display:grid; place-items:center; margin-top:14px; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Image Resizer</h2>
      <input id="w" value="640" /><br><br>
      <input id="h" value="480" /><br><br>
      <button onclick="resizePreview()">Preview Resize</button>
      <div class="preview"><div style="font-size:3rem;">🖼️</div></div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      function resizePreview(){ const w = document.getElementById('w').value; const h = document.getElementById('h').value; const preview = document.querySelector('.preview'); preview.style.width = `${w}px`; preview.style.height = `${h}px`; preview.style.maxWidth='100%'; }
    </script>
  </body>
</html>
