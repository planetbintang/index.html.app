<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(620px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:20px; text-align:center; }
      #quote { font-size:1.6rem; font-weight:700; margin:18px 0; }
      button { background:#2563eb; color:#fff; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Daily Quote</h2>
      <div id="quote">"Kreativitas adalah jalan paling cepat menuju solusi."</div>
      <button onclick="nextQuote()">Quote Baru</button>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
    <script>
      const quotes = ['"Kreativitas adalah jalan paling cepat menuju solusi."','"Belajar hari ini, membangun hari esok."','"Teknologi adalah alat, manusia adalah pintunya."','"Sederhana lebih kuat daripada rumit."'];
      function nextQuote(){ const item = quotes[Math.floor(Math.random()*quotes.length)]; document.getElementById('quote').textContent = item; }
    </script>
  </body>
</html>
