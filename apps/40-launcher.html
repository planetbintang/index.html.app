<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launcher</title>
    <style>
      body { margin:0; background:#020817; color:#e2e8f0; font-family:Arial; display:grid; place-items:center; min-height:100vh; }
      .box { width:min(900px,90vw); background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:18px; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
      .app { background:#111827; border:1px solid rgba(148,163,184,0.2); border-radius:12px; padding:16px; text-align:center; }
      a { color:#7dd3fc; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Desktop Launcher</h2>
      <div class="grid">
        <div class="app">📝 Editor</div>
        <div class="app">⏰ Jam</div>
        <div class="app">🧮 Kalkulator</div>
        <div class="app">📋 Todo</div>
        <div class="app">📚 Dict</div>
        <div class="app">🎨 Paint</div>
        <div class="app">📊 Analytics</div>
        <div class="app">⚙️ Settings</div>
      </div>
      <p><a href="../index.html">← Kembali</a></p>
    </div>
  </body>
</html>
