<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Tool</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020617, #111827);
        color: #e2e8f0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .panel {
        width: min(760px, 92vw);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
      }
      h1 { margin-top: 0; }
      textarea, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        padding: 12px 14px;
        font-size: 1rem;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
        background: rgba(2, 6, 23, 0.7);
        color: #e2e8f0;
        margin: 18px 0;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      button {
        background: #0ea5e9;
        color: #f8fafc;
        cursor: pointer;
        font-weight: 700;
      }
      button.secondary {
        background: transparent;
      }
      #output {
        background: rgba(15, 118, 110, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.25);
        padding: 14px;
        border-radius: 12px;
        white-space: pre-wrap;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>41 • Binary Converter</h1>
      <p>Masukkan teks untuk dikonversi ke format biner.</p>
      <textarea id="input">HELLO</textarea>
      <div class="row">
        <button id="convert">Konversi</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Output akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('convert').addEventListener('click', () => {
        const value = inputEl.value.trim();
        if (!value) {
          outputEl.textContent = 'Masukkan teks terlebih dahulu.';
          return;
        }
        const result = [...value].map(char => char.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
        outputEl.textContent = `Text: ${value}\nBinary: ${result}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'HELLO';
        outputEl.textContent = 'Output akan muncul di sini.';
      });
    </script>
  </body>
</html>
