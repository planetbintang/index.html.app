<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser System</title>
    <style>
      :root {
        --bg: #020817;
        --panel: rgba(15, 23, 42, 0.85);
        --panel-2: rgba(17, 24, 39, 0.92);
        --line: rgba(148, 163, 184, 0.26);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #7dd3fc;
        --accent-2: #34d399;
        --accent-3: #fbbf24;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, rgba(59,130,246,0.22), transparent 28%), linear-gradient(180deg, #020817 0%, #0f172a 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 18px;
      }
      .browser {
        width: min(1200px, 96vw);
        height: min(86vh, 820px);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        background: var(--panel-2);
        box-shadow: 0 25px 60px rgba(2, 6, 23, 0.6);
      }
      .browser-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(15, 23, 42, 0.9);
        border-bottom: 1px solid var(--line);
        padding: 12px 14px;
      }
      .traffic {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 82px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.red { background: #f87171; }
      .dot.yellow { background: #fbbf24; }
      .dot.green { background: #34d399; }
      .address {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 16px;
      }
      .address .lock {
        color: var(--accent-2);
        font-size: 0.95rem;
      }
      .address input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text);
        outline: none;
        font-size: 0.98rem;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        border: 1px solid var(--line);
        background: rgba(30, 41, 59, 0.85);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }
      button:hover {
        border-color: rgba(125, 211, 252, 0.9);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: rgba(15, 23, 42, 0.72);
        border-bottom: 1px solid var(--line);
        padding: 10px 14px;
      }
      .nav {
        display: flex;
        gap: 8px;
      }
      .nav button {
        width: 38px;
        height: 32px;
        padding: 0;
        font-size: 1rem;
      }
      .status {
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .frame-wrap {
        position: relative;
        width: 100%;
        height: calc(100% - 104px);
        background: #fff;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: linear-gradient(180deg, rgba(15,23,42,0.96), rgba(2,6,23,0.98));
        color: var(--text);
        text-align: center;
        padding: 32px;
      }
      .fallback.show {
        display: grid;
      }
      .fallback-card {
        max-width: 540px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
      }
      .fallback h2 { margin-top: 0; }
      .fallback p { color: var(--muted); line-height: 1.6; }
      @media (max-width: 768px) {
        .browser { height: 88vh; }
        .browser-bar { flex-wrap: wrap; }
        .actions { width: 100%; }
        .actions button { flex: 1; }
      }
    </style>
  </head>
  <body>
    <div class="browser" aria-label="GitHub browser system">
      <div class="browser-bar">
        <div class="traffic" aria-hidden="true">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <div class="address" role="search">
          <span class="lock">🔒</span>
          <input id="urlInput" type="text" value="https://github.com/" aria-label="Address bar" />
        </div>

        <div class="actions">
          <button id="goBtn">Go</button>
          <button id="newTabBtn">Open</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="nav" aria-label="Navigation controls">
          <button id="backBtn" title="Back">←</button>
          <button id="forwardBtn" title="Forward">→</button>
          <button id="reloadBtn" title="Reload">↻</button>
        </div>
        <div id="statusText" class="status">github.com</div>
      </div>

      <div class="frame-wrap">
        <iframe id="browserFrame" src="https://github.com/" title="GitHub viewer"></iframe>
        <div id="fallback" class="fallback" aria-live="polite">
          <div class="fallback-card">
            <h2>Browser shell aktif</h2>
            <p>Halaman GitHub memblokir embedding di iframe. Situs tetap dapat dibuka di tab baru untuk pengalaman browsing penuh.</p>
            <button id="openFallbackBtn">Buka https://github.com/</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const frame = document.getElementById('browserFrame');
      const urlInput = document.getElementById('urlInput');
      const statusText = document.getElementById('statusText');
      const fallback = document.getElementById('fallback');

      function normalizeUrl(input) {
        const value = input.trim();
        if (!value) return 'https://github.com/';
        if (/^https?:\/\//i.test(value)) return value;
        if (/^\S+\.\S+$/i.test(value)) return 'https://' + value;
        return 'https://github.com/search?q=' + encodeURIComponent(value);
      }

      function setStatus(label) {
        statusText.textContent = label;
      }

      function showFallback() {
        fallback.classList.add('show');
      }

      function hideFallback() {
        fallback.classList.remove('show');
      }

      function loadUrl(rawUrl) {
        const finalUrl = normalizeUrl(rawUrl);
        urlInput.value = finalUrl;
        hideFallback();
        frame.src = finalUrl;
        try {
          const host = new URL(finalUrl).hostname;
          setStatus(host);
        } catch (error) {
          setStatus('loading');
        }
      }

      document.getElementById('goBtn').addEventListener('click', () => loadUrl(urlInput.value));
      document.getElementById('newTabBtn').addEventListener('click', () => window.open(normalizeUrl(urlInput.value), '_blank'));
      document.getElementById('openFallbackBtn').addEventListener('click', () => window.open('https://github.com/', '_blank'));
      document.getElementById('reloadBtn').addEventListener('click', () => {
        frame.contentWindow ? frame.contentWindow.location.reload() : loadUrl(urlInput.value);
      });
      document.getElementById('backBtn').addEventListener('click', () => {
        if (frame.contentWindow && frame.contentWindow.history.length > 1) {
          frame.contentWindow.history.back();
        }
      });
      document.getElementById('forwardBtn').addEventListener('click', () => {
        if (frame.contentWindow) {
          frame.contentWindow.history.forward();
        }
      });

      urlInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') loadUrl(urlInput.value);
      });

      frame.addEventListener('load', () => {
        try {
          if (frame.contentDocument && frame.contentDocument.body && frame.contentDocument.body.innerText.length === 0) {
            showFallback();
            return;
          }
          const host = new URL(frame.src).hostname;
          setStatus(host);
          hideFallback();
        } catch (error) {
          setStatus('loading');
        }
      });

      frame.addEventListener('error', () => {
        showFallback();
      });

      setStatus('github.com');
    </script>
  </body>
</html>
