<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Builder</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0; font-family: Arial, Helvetica, sans-serif; }
      .panel { width: min(760px, 92vw); background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 18px; padding: 28px; }
      h1 { margin-top: 0; }
      input, button { width: 100%; border-radius: 12px; border: 1px solid rgba(148,163,184,.25); padding: 12px 14px; font-size: 1rem; }
      input { background: rgba(2, 6, 23, 0.7); color: #e2e8f0; margin: 18px 0; }
      .row { display: flex; gap: 10px; }
      button { background: #8b5cf6; color: white; cursor: pointer; font-weight: 700; }
      button.secondary { background: transparent; }
      #output { background: rgba(79, 70, 229, 0.12); border: 1px solid rgba(129, 140, 248, 0.25); border-radius: 12px; padding: 14px; white-space: pre-wrap; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>42 • URL Builder</h1>
      <p>Bangun URL dengan parameter yang rapi.</p>
      <input id="base" value="https://example.com/search" />
      <div class="row">
        <button id="build">Buat URL</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">URL akan muncul di sini.</div>
    </div>
    <script>
      const base = document.getElementById('base');
      const output = document.getElementById('output');
      document.getElementById('build').addEventListener('click', () => {
        const url = new URL(base.value || 'https://example.com');
        url.searchParams.set('q', 'index.html.app');
        url.searchParams.set('page', '1');
        output.textContent = url.toString();
      });
      document.getElementById('reset').addEventListener('click', () => {
        base.value = 'https://example.com/search';
        output.textContent = 'URL akan muncul di sini.';
      });
    </script>
  </body>
</html>
