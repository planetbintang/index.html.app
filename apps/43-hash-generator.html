<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hash Generator</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #111827, #020617); color: #e2e8f0; font-family: Arial, Helvetica, sans-serif; }
      .panel { width: min(760px, 92vw); background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 18px; padding: 28px; }
      h1 { margin-top: 0; }
      textarea, button { width: 100%; border-radius: 12px; padding: 12px 14px; font-size: 1rem; }
      textarea { background: rgba(2, 6, 23, 0.7); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.25); margin: 18px 0; min-height: 110px; }
      .row { display: flex; gap: 10px; }
      button { border: 1px solid rgba(148, 163, 184, 0.25); background: #ef4444; color: white; font-weight: 700; cursor: pointer; }
      button.secondary { background: transparent; }
      #output { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(248, 113, 113, 0.25); border-radius: 12px; padding: 14px; margin-top: 14px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>43 • Hash Generator</h1>
      <p>Bangkitkan fingerprint teks untuk identifikasi cepat.</p>
      <textarea id="input">index.html.app</textarea>
      <div class="row">
        <button id="hash">Generate</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil hash akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      function hashCode(value) {
        return Array.from(value).reduce((acc, char) => ((acc << 5) - acc + char.charCodeAt(0)) | 0, 0).toString(16);
      }
      document.getElementById('hash').addEventListener('click', () => {
        const value = inputEl.value.trim();
        outputEl.textContent = `Original: ${value}\nHash: ${hashCode(value)}\nLength: ${value.length}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'index.html.app';
        outputEl.textContent = 'Hasil hash akan muncul di sini.';
      });
    </script>
  </body>
</html>
