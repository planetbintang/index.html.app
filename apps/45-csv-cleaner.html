<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Cleaner</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #0f172a, #111827); color:#e2e8f0; font-family: Arial, Helvetica, sans-serif; }
      .panel { width: min(760px, 92vw); background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 18px; padding: 28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { margin:18px 0; min-height:130px; background: rgba(2,6,23,0.7); color:#e2e8f0; }
      .row { display:flex; gap:10px; }
      button { background: #f59e0b; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(245,158,11,0.08); border: 1px solid rgba(252,211,77,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>45 • CSV Cleaner</h1>
      <p>Hapus whitespace, baris kosong, dan spasi ganda.</p>
      <textarea id="input">name, city, role
Andi, Bandung, Admin
  Budi ,  Jakarta  , Dev

Citra, Surabaya, Designer</textarea>
      <div class="row">
        <button id="clean">Bersihkan</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil bersih akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('clean').addEventListener('click', () => {
        const rows = inputEl.value.split('\n').map(row => row.trim()).filter(Boolean);
        const cleaned = rows.map(row => row.split(',').map(cell => cell.trim()).join(',')).join('\n');
        outputEl.textContent = cleaned;
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'name, city, role\nAndi, Bandung, Admin\n  Budi ,  Jakarta  , Dev\n\nCitra, Surabaya, Designer';
        outputEl.textContent = 'Hasil bersih akan muncul di sini.';
      });
    </script>
  </body>
</html>
