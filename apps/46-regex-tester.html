<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regex Tester</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: #020617; color:#e2e8f0; font-family: Arial, Helvetica, sans-serif; }
      .panel { width: min(760px, 92vw); background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input, textarea { background: rgba(2,6,23,0.7); color:#e2e8f0; margin: 18px 0; }
      textarea { min-height: 110px; }
      .row { display:flex; gap:10px; }
      button { background: #22c55e; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(34,197,94,0.08); border: 1px solid rgba(74,222,128,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>46 • Regex Tester</h1>
      <p>Uji pola teks dengan ekspresi regular.</p>
      <input id="pattern" value="\d{3,5}" />
      <textarea id="sample">Kode: 12345, 987, 3210</textarea>
      <div class="row">
        <button id="match">Cocokkan</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil logika regex akan muncul di sini.</div>
    </div>
    <script>
      const patternEl = document.getElementById('pattern');
      const sampleEl = document.getElementById('sample');
      const outputEl = document.getElementById('output');
      document.getElementById('match').addEventListener('click', () => {
        try {
          const regex = new RegExp(patternEl.value, 'g');
          const matches = sampleEl.value.match(regex) || [];
          outputEl.textContent = `Pattern: ${patternEl.value}\nMatch: ${matches.join(', ') || '(tidak ada)'}`;
        } catch (error) {
          outputEl.textContent = `Error: ${error.message}`;
        }
      });
      document.getElementById('reset').addEventListener('click', () => {
        patternEl.value = '\\d{3,5}';
        sampleEl.value = 'Kode: 12345, 987, 3210';
        outputEl.textContent = 'Hasil logika regex akan muncul di sini.';
      });
    </script>
  </body>
</html>
