<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Reader Mock</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; min-height:120px; }
      .row { display:flex; gap:10px; }
      button { background:#f97316; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background:transparent; }
      #output { background: rgba(249,115,22,0.08); border:1px solid rgba(251,146,60,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>48 • QR Reader Mock</h1>
      <p>Masukkan data untuk memproyeksikan hasil QR.</p>
      <textarea id="input">https://sumberkode.github.io/index.html.app/</textarea>
      <div class="row">
        <button id="read">Decode</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil data QR akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('read').addEventListener('click', () => {
        const value = inputEl.value.trim();
        const blocks = value.split('/').filter(Boolean);
        outputEl.textContent = `Source: ${value}\nPrefix: ${blocks[0] || 'unknown'}\nPayload: ${value.length} chars`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'https://sumberkode.github.io/index.html.app/';
        outputEl.textContent = 'Hasil data QR akan muncul di sini.';
      });
    </script>
  </body>
</html>
