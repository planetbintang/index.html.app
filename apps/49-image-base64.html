<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Base64</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #111827, #0f172a); color:#e2e8f0; font-family: Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background: rgba(15, 23, 42, 0.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border: 1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; min-height:120px; }
      .row { display:flex; gap:10px; }
      button { background: #8b5cf6; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(139,92,246,0.08); border:1px solid rgba(167,139,250,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>49 • Image Base64</h1>
      <p>Enkripsi teks menjadi format base64 ringkas.</p>
      <textarea id="input">logo-app</textarea>
      <div class="row">
        <button id="encode">Encode</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil encoding akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('encode').addEventListener('click', () => {
        const value = inputEl.value.trim();
        const encoded = btoa(unescape(encodeURIComponent(value)));
        outputEl.textContent = `Original: ${value}\nBase64: ${encoded}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'logo-app';
        outputEl.textContent = 'Hasil encoding akan muncul di sini.';
      });
    </script>
  </body>
</html>
