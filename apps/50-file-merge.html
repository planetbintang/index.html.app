<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Merge</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: #020617; color:#e2e8f0; font-family: Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background: rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; min-height:120px; }
      .row { display:flex; gap:10px; }
      button { background:#0ea5e9; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background:transparent; }
      #output { background: rgba(14,165,233,0.08); border:1px solid rgba(125,211,252,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>50 • File Merge</h1>
      <p>Gabungkan dua blok teks jadi satu rangkaian.</p>
      <textarea id="left">header
alpha
beta</textarea>
      <textarea id="right">footer
gamma
delta</textarea>
      <div class="row">
        <button id="merge">Gabungkan</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil gabungan akan muncul di sini.</div>
    </div>
    <script>
      const leftEl = document.getElementById('left');
      const rightEl = document.getElementById('right');
      const outputEl = document.getElementById('output');
      document.getElementById('merge').addEventListener('click', () => {
        const merged = `${leftEl.value.trim()}\n${rightEl.value.trim()}`;
        outputEl.textContent = merged;
      });
      document.getElementById('reset').addEventListener('click', () => {
        leftEl.value = 'header\nalpha\nbeta';
        rightEl.value = 'footer\ngamma\ndelta';
        outputEl.textContent = 'Hasil gabungan akan muncul di sini.';
      });
    </script>
  </body>
</html>
