<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Converter</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #111827, #1e293b); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color: #e2e8f0; margin:18px 0; min-height:120px; }
      .row { display:flex; gap:10px; }
      button { background: #ec4899; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(236,72,153,0.08); border:1px solid rgba(244,114,182,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>52 • Case Converter</h1>
      <p>Ubah format teks menjadi upper, lower, title, dan sentence.</p>
      <textarea id="input">index html app desktop</textarea>
      <div class="row">
        <button id="convert">Ubah</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil konversi akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('convert').addEventListener('click', () => {
        const text = inputEl.value.trim();
        const latest = {
          upper: text.toUpperCase(),
          lower: text.toLowerCase(),
          title: text.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' '),
          sentence: text.charAt(0).toUpperCase() + text.slice(1).toLowerCase()
        };
        outputEl.textContent = `Upper: ${latest.upper}\nLower: ${latest.lower}\nTitle: ${latest.title}\nSentence: ${latest.sentence}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'index html app desktop';
        outputEl.textContent = 'Hasil konversi akan muncul di sini.';
      });
    </script>
  </body>
</html>
