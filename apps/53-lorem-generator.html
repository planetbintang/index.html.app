<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorem Generator</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#a855f7; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background:transparent; }
      #output { background: rgba(168,85,247,0.08); border:1px solid rgba(216,180,254,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>53 • Lorem Generator</h1>
      <p>Hasilkan paragraf dummy untuk desain atau mockup.</p>
      <input id="count" value="3" />
      <div class="row">
        <button id="generate">Generate</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Paragraf akan muncul di sini.</div>
    </div>
    <script>
      const sentences = ['Lorem ipsum dolor sit amet.', 'Teknologi membuat proses cepat dan rapi.', 'Workspace modern memudahkan kolaborasi tim.', 'Desain responsif menjaga pengalaman pengguna.'];
      const countEl = document.getElementById('count');
      const outputEl = document.getElementById('output');
      document.getElementById('generate').addEventListener('click', () => {
        const count = Number(countEl.value) || 3;
        const content = Array.from({ length: count }, (_, index) => `${index + 1}. ${sentences[index % sentences.length]}`).join('\n');
        outputEl.textContent = content;
      });
      document.getElementById('reset').addEventListener('click', () => {
        countEl.value = '3';
        outputEl.textContent = 'Paragraf akan muncul di sini.';
      });
    </script>
  </body>
</html>
