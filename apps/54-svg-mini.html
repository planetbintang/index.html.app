<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Mini</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #0f172a, #020617); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background: #f59e0b; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(245,158,11,0.08); border:1px solid rgba(251,191,36,0.25); border-radius:12px; padding:14px; margin-top:14px; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>54 • SVG Mini</h1>
      <p>Hasilkan logo SVG pendek dengan warna acak.</p>
      <input id="color" value="#7dd3fc" />
      <div class="row">
        <button id="render">Render</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output"></div>
    </div>
    <script>
      const colorEl = document.getElementById('color');
      const outputEl = document.getElementById('output');
      function renderSvg(color) {
        return `<svg width="240" height="120" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="120" rx="18" fill="#111827"/><circle cx="60" cy="60" r="30" fill="${color}"/><rect x="110" y="32" width="90" height="18" rx="9" fill="${color}" opacity="0.9"/><rect x="110" y="62" width="70" height="18" rx="9" fill="${color}" opacity="0.7"/></svg>`;
      }
      document.getElementById('render').addEventListener('click', () => {
        const color = colorEl.value.trim() || '#7dd3fc';
        outputEl.innerHTML = renderSvg(color);
      });
      document.getElementById('reset').addEventListener('click', () => {
        colorEl.value = '#7dd3fc';
        outputEl.innerHTML = '';
      });
    </script>
  </body>
</html>
