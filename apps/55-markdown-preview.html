<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Preview</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; min-height:130px; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#38bdf8; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(56,189,248,0.08); border:1px solid rgba(125,211,252,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>55 • Markdown Preview</h1>
      <p>Tampilkan cuplikan markdown sebagai ragam teks.</p>
      <textarea id="input"># Judul\n\n- Item 1\n- Item 2\n\n**tebal** dan *miring*</textarea>
      <div class="row">
        <button id="preview">Preview</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Preview markdown akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('preview').addEventListener('click', () => {
        const value = inputEl.value.trim();
        const lines = value.split('\n').map(line => line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>'));
        outputEl.innerHTML = lines.join('<br>');
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = '# Judul\n\n- Item 1\n- Item 2\n\n**tebal** dan *miring*';
        outputEl.textContent = 'Preview markdown akan muncul di sini.';
      });
    </script>
  </body>
</html>
