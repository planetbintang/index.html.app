<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAML JSON</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #020617, #111827); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; min-height:130px; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#f87171; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(248,113,113,0.08); border:1px solid rgba(254,178,178,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>56 • YAML JSON</h1>
      <p>Ubah format YAML sederhana menjadi JSON.</p>
      <textarea id="input">name: AppHub\nversion: 1.0.0\nactive: true</textarea>
      <div class="row">
        <button id="convert">Convert</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">JSON hasil konversi akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('convert').addEventListener('click', () => {
        const lines = inputEl.value.trim().split('\n');
        const obj = {};
        lines.forEach(line => {
          const [key, value] = line.split(':');
          if (!key) return;
          obj[key.trim()] = value ? value.trim().replace(/^"|"$/g, '') : '';
        });
        outputEl.textContent = JSON.stringify(obj, null, 2);
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'name: AppHub\nversion: 1.0.0\nactive: true';
        outputEl.textContent = 'JSON hasil konversi akan muncul di sini.';
      });
    </script>
  </body>
</html>
