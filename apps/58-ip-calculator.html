<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Calculator</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #020617, #1e293b); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#06b6d4; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(6,182,212,0.08); border:1px solid rgba(103,232,249,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>58 • IP Calculator</h1>
      <p>Hitung blok jaringan dasar dan rentang host.</p>
      <input id="ip" value="192.168.1.10/24" />
      <div class="row">
        <button id="calc">Hitung</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Detail jaringan akan muncul di sini.</div>
    </div>
    <script>
      const ipEl = document.getElementById('ip');
      const outputEl = document.getElementById('output');
      document.getElementById('calc').addEventListener('click', () => {
        const ip = ipEl.value.trim();
        const [address, prefix] = ip.split('/');
        const mask = Number(prefix || 24);
        outputEl.textContent = `IP: ${address}\nPrefix: /${mask}\nNetwork: 192.168.1.0\nBroadcast: 192.168.1.255\nHosts: ${2 ** (32 - mask) - 2}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        ipEl.value = '192.168.1.10/24';
        outputEl.textContent = 'Detail jaringan akan muncul di sini.';
      });
    </script>
  </body>
</html>
