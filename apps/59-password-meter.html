<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Meter</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#84cc16; color:#111827; cursor:pointer; font-weight:800; }
      button.secondary { background: transparent; }
      #output { background: rgba(132,204,22,0.08); border:1px solid rgba(163,230,53,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>59 • Password Meter</h1>
      <p>Uji kekuatan kata sandi terhadap beberapa aturan.</p>
      <input id="password" value="Passw0rd!" />
      <div class="row">
        <button id="check">Cek</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Skor keamanan akan muncul di sini.</div>
    </div>
    <script>
      const passwordEl = document.getElementById('password');
      const outputEl = document.getElementById('output');
      document.getElementById('check').addEventListener('click', () => {
        const password = passwordEl.value;
        let score = 0;
        if (password.length >= 8) score += 1;
        if (/[A-Z]/.test(password)) score += 1;
        if (/[0-9]/.test(password)) score += 1;
        if (/[^A-Za-z0-9]/.test(password)) score += 1;
        const label = score >= 4 ? 'Strong' : score >= 3 ? 'Medium' : 'Weak';
        outputEl.textContent = `Password: ${password}\nScore: ${score}/4\nStatus: ${label}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        passwordEl.value = 'Passw0rd!';
        outputEl.textContent = 'Skor keamanan akan muncul di sini.';
      });
    </script>
  </body>
</html>
