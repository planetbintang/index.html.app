<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorting Visualizer</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#8b5cf6; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(139,92,246,0.08); border:1px solid rgba(167,139,250,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>61 • Sorting Visualizer</h1>
      <p>Urutkan daftar angka berdasarkan pendekatan sederhana.</p>
      <input id="nums" value="8, 3, 11, 2, 7" />
      <div class="row">
        <button id="sort">Urutkan</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Urutan terurut akan muncul di sini.</div>
    </div>
    <script>
      const numsEl = document.getElementById('nums');
      const outputEl = document.getElementById('output');
      document.getElementById('sort').addEventListener('click', () => {
        const list = numsEl.value.split(',').map(value => Number(value.trim())).filter(Number.isFinite);
        outputEl.textContent = `Input: ${list.join(', ')}\nSorted: ${list.slice().sort((a,b) => a - b).join(', ')}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        numsEl.value = '8, 3, 11, 2, 7';
        outputEl.textContent = 'Urutan terurut akan muncul di sini.';
      });
    </script>
  </body>
</html>
