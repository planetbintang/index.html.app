<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Builder</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { min-height:120px; background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#22d3ee; color:#0f172a; cursor:pointer; font-weight:900; }
      button.secondary { background: transparent; }
      #output { background: rgba(34,211,238,0.08); border:1px solid rgba(103,232,249,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>63 • Template Builder</h1>
      <p>Rakit template cepat berdasarkan nama dan versi.</p>
      <input id="name" value="AppHub" />
      <textarea id="body">start\nstatus: ready\nend</textarea>
      <div class="row">
        <button id="build">Build</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Template akan muncul di sini.</div>
    </div>
    <script>
      const nameEl = document.getElementById('name');
      const bodyEl = document.getElementById('body');
      const outputEl = document.getElementById('output');
      document.getElementById('build').addEventListener('click', () => {
        const name = nameEl.value.trim() || 'AppHub';
        const body = bodyEl.value.trim() || 'start';
        outputEl.textContent = `# ${name}\n\n${body}\n\nCreated with AppHub Template Engine`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        nameEl.value = 'AppHub';
        bodyEl.value = 'start\nstatus: ready\nend';
        outputEl.textContent = 'Template akan muncul di sini.';
      });
    </script>
  </body>
</html>
