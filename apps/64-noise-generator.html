<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noise Generator</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #111827, #020617); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#ef4444; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(239,68,68,0.08); border:1px solid rgba(248,113,113,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>64 • Noise Generator</h1>
      <p>Buat deret angka acak untuk simulasi atau testing.</p>
      <input id="count" value="8" />
      <div class="row">
        <button id="generate">Generate</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Deret acak akan muncul di sini.</div>
    </div>
    <script>
      const countEl = document.getElementById('count');
      const outputEl = document.getElementById('output');
      document.getElementById('generate').addEventListener('click', () => {
        const count = Number(countEl.value) || 8;
        const values = Array.from({ length: count }, () => Math.floor(Math.random() * 100));
        outputEl.textContent = values.join(', ');
      });
      document.getElementById('reset').addEventListener('click', () => {
        countEl.value = '8';
        outputEl.textContent = 'Deret acak akan muncul di sini.';
      });
    </script>
  </body>
</html>
