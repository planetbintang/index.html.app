<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Format</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#10b981; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(16,185,129,0.08); border:1px solid rgba(52,211,153,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>67 • Number Format</h1>
      <p>Format angka secara ringkas ke versi lokal.</p>
      <input id="value" value="1234567.89" />
      <div class="row">
        <button id="format">Format</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Format angka akan muncul di sini.</div>
    </div>
    <script>
      const valueEl = document.getElementById('value');
      const outputEl = document.getElementById('output');
      document.getElementById('format').addEventListener('click', () => {
        const value = Number(valueEl.value || 0);
        outputEl.textContent = `Plain: ${value}\nIntl: ${new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 }).format(value)}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        valueEl.value = '1234567.89';
        outputEl.textContent = 'Format angka akan muncul di sini.';
      });
    </script>
  </body>
</html>
