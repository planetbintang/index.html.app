<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Info</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; background:#3b82f6; color:white; cursor:pointer; font-weight:700; }
      #output { background: rgba(59,130,246,0.08); border:1px solid rgba(96,165,250,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>68 • Browser Info</h1>
      <p>Ambil informasi basic browser yang sedang aktif.</p>
      <button id="detect">Deteksi</button>
      <div id="output">Detail browser akan muncul di sini.</div>
    </div>
    <script>
      const outputEl = document.getElementById('output');
      document.getElementById('detect').addEventListener('click', () => {
        const nav = navigator;
        outputEl.textContent = `Browser: ${nav.userAgent}\nPlatform: ${nav.platform}\nLanguage: ${nav.language}`;
      });
    </script>
  </body>
</html>
