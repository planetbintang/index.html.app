<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; min-height:120px; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#84cc16; color:#111827; cursor:pointer; font-weight:800; }
      button.secondary { background: transparent; }
      #output { background: rgba(132,204,22,0.08); border:1px solid rgba(163,230,53,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>70 • Sticky Notes</h1>
      <p>Catat ide-ide singkat ke dalam notes ringkas.</p>
      <textarea id="note">Buat roadmap mingguan\nTinjau modul baru\nRilis fitur publik</textarea>
      <div class="row">
        <button id="save">Simpan</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Catatan Anda akan muncul di sini.</div>
    </div>
    <script>
      const noteEl = document.getElementById('note');
      const outputEl = document.getElementById('output');
      document.getElementById('save').addEventListener('click', () => {
        localStorage.setItem('apphub-sticky-note', noteEl.value);
        outputEl.textContent = `Saved:\n${noteEl.value}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        noteEl.value = 'Buat roadmap mingguan\nTinjau modul baru\nRilis fitur publik';
        outputEl.textContent = 'Catatan Anda akan muncul di sini.';
      });
    </script>
  </body>
</html>
