<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Tester</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #020617, #111827); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; background:#60a5fa; color:white; cursor:pointer; font-weight:700; }
      #output { background: rgba(96,165,250,0.08); border:1px solid rgba(147,197,253,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>71 • Keyboard Tester</h1>
      <p>Tekan tombol untuk melihat input keyboard aktif.</p>
      <button id="trigger">Mulai Deteksi</button>
      <div id="output">Kunci yang ditekan akan muncul di sini.</div>
    </div>
    <script>
      const outputEl = document.getElementById('output');
      document.getElementById('trigger').addEventListener('click', () => {
        window.addEventListener('keydown', (event) => {
          outputEl.textContent = `Key pressed: ${event.key}\nCode: ${event.code}`;
        }, { once: true });
      });
    </script>
  </body>
</html>
