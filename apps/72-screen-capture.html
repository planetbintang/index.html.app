<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Capture Mock</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; background:#f97316; color:white; cursor:pointer; font-weight:700; }
      #output { background: rgba(249,115,22,0.08); border:1px solid rgba(251,146,60,0.25); border-radius:12px; padding:14px; margin-top:14px; }
      .frame { width:100%; height:180px; background: linear-gradient(135deg, #111827, #1f2937); border-radius:12px; margin-top:14px; position:relative; }
      .frame::before { content:''; position:absolute; inset:18px; border:2px solid rgba(255,255,255,.1); border-radius:10px; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>72 • Screen Capture Mock</h1>
      <p>Simulasi jendela desktop yang siap di-capture.</p>
      <button id="snap">Capture</button>
      <div class="frame"></div>
      <div id="output">Status capture akan muncul di sini.</div>
    </div>
    <script>
      const outputEl = document.getElementById('output');
      document.getElementById('snap').addEventListener('click', () => {
        outputEl.textContent = `Capture ready: ${new Date().toLocaleTimeString()}\nResolution: 1920x1080`;
      });
    </script>
  </body>
</html>
