<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Table</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      table { width:100%; border-collapse:collapse; margin-top:20px; }
      th, td { padding:10px 12px; border-bottom:1px solid rgba(148,163,184,.2); text-align:left; }
      button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; background:#8b5cf6; color:white; cursor:pointer; font-weight:700; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>73 • Data Table</h1>
      <p>Menampilkan ringkasan dataset ringan.</p>
      <button id="render">Tampilkan Data</button>
      <table id="table"></table>
    </div>
    <script>
      const rows = [
        ['Alpha', 'Ready', '89%'],
        ['Beta', 'Review', '76%'],
        ['Gamma', 'Live', '91%']
      ];
      document.getElementById('render').addEventListener('click', () => {
        const table = document.getElementById('table');
        table.innerHTML = '<tr><th>Name</th><th>Status</th><th>Score</th></tr>' + rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('');
      });
    </script>
  </body>
</html>
