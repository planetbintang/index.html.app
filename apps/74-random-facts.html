<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Facts</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #0f172a, #020617); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; background:#a855f7; color:white; cursor:pointer; font-weight:700; }
      #output { background: rgba(168,85,247,0.08); border:1px solid rgba(216,180,254,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>74 • Random Facts</h1>
      <p>Menampilkan fakta singkat dari katalog internal.</p>
      <button id="show">Tampilkan Fakta</button>
      <div id="output">Fakta akan muncul di sini.</div>
    </div>
    <script>
      const facts = [
        'AppHub dapat berjalan langsung dari browser tanpa instalasi.',
        'Format HTML membuat deployment cepat dan ringan.',
        'Setiap modul dibuat agar dapat dipakai secara mandiri.'
      ];
      document.getElementById('show').addEventListener('click', () => {
        const fact = facts[Math.floor(Math.random() * facts.length)];
        document.getElementById('output').textContent = fact;
      });
    </script>
  </body>
</html>
