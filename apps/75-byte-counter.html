<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byte Counter</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; min-height:120px; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#14b8a6; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(20,184,166,0.08); border:1px solid rgba(45,212,191,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>75 • Byte Counter</h1>
      <p>Hitung ukuran teks dalam byte, karakter, dan kata.</p>
      <textarea id="input">AppHub Desktop Launcher</textarea>
      <div class="row">
        <button id="count">Hitung</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Statistik akan muncul di sini.</div>
    </div>
    <script>
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      document.getElementById('count').addEventListener('click', () => {
        const value = inputEl.value;
        outputEl.textContent = `Bytes: ${new Blob([value]).size}\nCharacters: ${value.length}\nWords: ${value.trim().split(/\s+/).filter(Boolean).length}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        inputEl.value = 'AppHub Desktop Launcher';
        outputEl.textContent = 'Statistik akan muncul di sini.';
      });
    </script>
  </body>
</html>
