<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Tracker</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#22c55e; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(34,197,94,0.08); border:1px solid rgba(74,222,128,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>76 • Health Tracker</h1>
      <p>Catat pola aktivitas harian untuk evaluasi umum.</p>
      <input id="steps" value="8500" />
      <div class="row">
        <button id="track">Track</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Status kesehatan harian akan muncul di sini.</div>
    </div>
    <script>
      const stepsEl = document.getElementById('steps');
      const outputEl = document.getElementById('output');
      document.getElementById('track').addEventListener('click', () => {
        const steps = Number(stepsEl.value) || 0;
        const status = steps >= 8000 ? 'Excellent' : steps >= 5000 ? 'Good' : 'Needs Improvement';
        outputEl.textContent = `Steps: ${steps}\nStatus: ${status}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        stepsEl.value = '8500';
        outputEl.textContent = 'Status kesehatan harian akan muncul di sini.';
      });
    </script>
  </body>
</html>
