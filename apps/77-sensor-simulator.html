<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor Simulator</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#38bdf8; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(56,189,248,0.08); border:1px solid rgba(125,211,252,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>77 • Sensor Simulator</h1>
      <p>Simulasi pembacaan sensor lingkungan dari dataset sederhana.</p>
      <input id="temp" value="27.5" />
      <div class="row">
        <button id="read">Baca</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Hasil sensor akan muncul di sini.</div>
    </div>
    <script>
      const tempEl = document.getElementById('temp');
      const outputEl = document.getElementById('output');
      document.getElementById('read').addEventListener('click', () => {
        const temp = Number(tempEl.value) || 0;
        const status = temp > 30 ? 'Hot' : temp > 20 ? 'Normal' : 'Cool';
        outputEl.textContent = `Temperature: ${temp}C\nStatus: ${status}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        tempEl.value = '27.5';
        outputEl.textContent = 'Hasil sensor akan muncul di sini.';
      });
    </script>
  </body>
</html>
