<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Planner</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#020617; color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      input, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      input { background: rgba(2,6,23,.7); color:#e2e8f0; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#f59e0b; color:#111827; cursor:pointer; font-weight:900; }
      button.secondary { background: transparent; }
      #output { background: rgba(245,158,11,0.08); border:1px solid rgba(252,211,77,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>78 • Budget Planner</h1>
      <p>Hitung sisa anggaran setelah pengeluaran.</p>
      <input id="budget" value="5000000" />
      <input id="spent" value="1800000" />
      <div class="row">
        <button id="calc">Hitung</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Sisa anggaran akan muncul di sini.</div>
    </div>
    <script>
      const budgetEl = document.getElementById('budget');
      const spentEl = document.getElementById('spent');
      const outputEl = document.getElementById('output');
      document.getElementById('calc').addEventListener('click', () => {
        const budget = Number(budgetEl.value) || 0;
        const spent = Number(spentEl.value) || 0;
        const left = budget - spent;
        outputEl.textContent = `Budget: ${budget}\nSpent: ${spent}\nRemaining: ${left}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        budgetEl.value = '5000000';
        spentEl.value = '1800000';
        outputEl.textContent = 'Sisa anggaran akan muncul di sini.';
      });
    </script>
  </body>
</html>
