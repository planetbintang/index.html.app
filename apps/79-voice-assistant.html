<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Assistant</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: linear-gradient(135deg, #111827, #020617); color:#e2e8f0; font-family:Arial,Helvetica,sans-serif; }
      .panel { width:min(760px,92vw); background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:18px; padding:28px; }
      h1 { margin-top:0; }
      textarea, button { width:100%; border-radius:12px; border:1px solid rgba(148,163,184,.25); padding:12px 14px; font-size:1rem; }
      textarea { background: rgba(2,6,23,.7); color:#e2e8f0; min-height:120px; margin:18px 0; }
      .row { display:flex; gap:10px; }
      button { background:#f43f5e; color:white; cursor:pointer; font-weight:700; }
      button.secondary { background: transparent; }
      #output { background: rgba(244,63,94,0.08); border:1px solid rgba(251,113,133,0.25); border-radius:12px; padding:14px; margin-top:14px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>79 • Voice Assistant</h1>
      <p>Simulasi asisten PAD untuk perintah sederhana.</p>
      <textarea id="command">Buka app launcher</textarea>
      <div class="row">
        <button id="run">Jalankan</button>
        <button class="secondary" id="reset">Reset</button>
      </div>
      <div id="output">Respons asisten akan muncul di sini.</div>
    </div>
    <script>
      const commandEl = document.getElementById('command');
      const outputEl = document.getElementById('output');
      document.getElementById('run').addEventListener('click', () => {
        const command = commandEl.value.toLowerCase();
        const reply = command.includes('launcher') ? 'Launcher dibuka dengan sukses.' : command.includes('status') ? 'Sistem sedang aktif dan siap.' : 'Perintah diterima dalam mode simulasi.';
        outputEl.textContent = `Command: ${commandEl.value}\nAssistant: ${reply}`;
      });
      document.getElementById('reset').addEventListener('click', () => {
        commandEl.value = 'Buka app launcher';
        outputEl.textContent = 'Respons asisten akan muncul di sini.';
      });
    </script>
  </body>
</html>
