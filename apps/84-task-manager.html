<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    :root {
      --bg: #0a1020;
      --panel: rgba(15,23,42,0.8);
      --card: rgba(30,41,59,0.7);
      --text: #ebf4ff;
      --muted: #9db0cb;
      --line: rgba(148,163,184,0.22);
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --gold: #fbbf24;
      --shadow: rgba(2,6,23,0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: radial-gradient(circle at top, rgba(125,211,252,0.15), transparent 30%), linear-gradient(135deg, #070d18 0%, #020817 100%); color: var(--text); }
    .app { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .brand { font-size: 1.8rem; font-weight: 800; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a { background: rgba(15,23,42,0.8); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 0.8rem; }
    .nav a.active { background: rgba(14,116,144,0.18); border-color: rgba(125,211,252,0.6); }
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
    .panel { background: rgba(15,23,42,0.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 30px var(--shadow); }
    .left { padding: 16px; }
    .right { padding: 18px; }
    .sidebar-label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 14px; }
    .sidebar-list { display: grid; gap: 10px; }
    .sidebar-item {
      display: flex; justify-content: space-between; align-items: center; background: rgba(30,41,59,0.5); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    .sidebar-item.active { background: rgba(14,116,144,0.18); border-color: rgba(125,211,252,0.6); }
    .dashboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .metric { background: rgba(17,24,39,0.8); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .metric .label { display: block; color: var(--muted); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
    .metric .value { font-size: 1.8rem; font-weight: 800; }
    .tasks { margin-top: 18px; display: grid; gap: 12px; }
    .task-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: rgba(17,24,39,0.7); border: 1px solid var(--line); border-radius: 12px;
    }
    .task-meta { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-2); }
    .task-note { color: var(--muted); font-size: 0.82rem; }
    .priority { border: 1px solid rgba(251,191,36,0.5); color: var(--gold); background: rgba(251,191,36,0.1); border-radius: 999px; padding: 5px 8px; font-size: 0.72rem; }
    .progress { margin-top: 18px; }
    .bar { height: 10px; border-radius: 999px; background: rgba(148,163,184,0.14); overflow: hidden; }
    .bar > span { display: block; width: 72%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, rgba(14,116,144,0.9), rgba(52,211,153,0.9)); }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .dashboard { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Task Manager</div>
      <div class="nav">
        <a href="../index.html">Home</a>
        <a href="81-font-manager.html">Font</a>
        <a href="82-icon-pack-manager.html">Icon Pack</a>
        <a href="83-clipboard-manager.html">Clipboard</a>
        <a href="84-task-manager.html" class="active">Task</a>
      </div>
    </div>

    <div class="layout">
      <aside class="panel left">
        <div class="sidebar-label">Menu</div>
        <div class="sidebar-list">
          <div class="sidebar-item active"><span>Overview</span><span>◉</span></div>
          <div class="sidebar-item"><span>Today</span><span>3</span></div>
          <div class="sidebar-item"><span>Calendar</span><span>7</span></div>
          <div class="sidebar-item"><span>Reports</span><span>↗</span></div>
          <div class="sidebar-item"><span>Team</span><span>◎</span></div>
        </div>
      </aside>

      <main class="panel right">
        <div class="dashboard">
          <div class="metric"><span class="label">Open Tasks</span><span class="value">128</span></div>
          <div class="metric"><span class="label">Completed</span><span class="value">94</span></div>
          <div class="metric"><span class="label">Productivity</span><span class="value">72%</span></div>
        </div>

        <div class="progress">
          <div class="task-note" style="margin-bottom: 8px;">Sprint progress</div>
          <div class="bar"><span></span></div>
        </div>

        <div class="tasks">
          <div class="task-item">
            <div class="task-meta"><span class="dot"></span><div><strong>Design system</strong><div class="task-note">Finalize dashboard components</div></div></div>
            <span class="priority">High</span>
          </div>
          <div class="task-item">
            <div class="task-meta"><span class="dot" style="background: var(--gold);"></span><div><strong>QA Review</strong><div class="task-note">Regression on mobile view</div></div></div>
            <span class="priority">Medium</span>
          </div>
          <div class="task-item">
            <div class="task-meta"><span class="dot" style="background: var(--accent);"></span><div><strong>API Integration</strong><div class="task-note">Connect settings sync</div></div></div>
            <span class="priority">Low</span>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
