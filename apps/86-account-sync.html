<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akun & Sinkronisasi</title>
  <style>
    :root {
      --bg: #0a1020;
      --panel: rgba(15,23,42,0.8);
      --card: rgba(17,24,39,0.84);
      --text: #ebf7ff;
      --muted: #a0b6d2;
      --line: rgba(148,163,184,0.22);
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --shadow: rgba(2,6,23,0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #070d18 0%, #020817 100%); color: var(--text); }
    .app { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .brand { font-size: 1.8rem; font-weight: 800; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a { background: rgba(15,23,42,0.8); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 0.8rem; }
    .nav a.active { background: rgba(14,116,144,0.18); border-color: rgba(125,211,252,0.6); }
    .layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; }
    .panel { background: rgba(15,23,42,0.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 32px var(--shadow); }
    .left, .right { padding: 18px; }
    .account {
      display: flex; align-items: center; gap: 16px; background: rgba(17,24,39,0.8); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px;
    }
    .avatar {
      width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, rgba(14,116,144,0.9), rgba(52,211,153,0.9)); display: flex; align-items: center; justify-content: center; font-weight: 800;
    }
    .meta h3 { margin: 0; }
    .meta p { margin: 8px 0 0; color: var(--muted); }
    .settings { display: grid; gap: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; background: rgba(17,24,39,0.76); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .switch {
      width: 42px; height: 24px; border-radius: 999px; background: rgba(148,163,184,0.28); border: 1px solid var(--line); position: relative;
    }
    .switch::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 2px; border-radius: 50%; background: #fff; transition: 0.2s ease; }
    .switch.on { background: rgba(52,211,153,0.38); }
    .switch.on::before { left: 20px; }
    .box { background: rgba(17,24,39,0.8); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .box h4 { margin: 0 0 12px; }
    ul { margin: 0; padding-left: 18px; color: var(--muted); }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Akun &amp; Sinkronisasi</div>
      <div class="nav">
        <a href="../index.html">Home</a>
        <a href="81-font-manager.html">Font</a>
        <a href="82-icon-pack-manager.html">Icon Pack</a>
        <a href="85-quick-settings.html">Quick Settings</a>
        <a href="86-account-sync.html" class="active">Sync</a>
      </div>
    </div>

    <div class="layout">
      <div class="panel left">
        <div class="account">
          <div class="avatar">G</div>
          <div class="meta">
            <h3>Google Account</h3>
            <p>nama@akun.com</p>
          </div>
        </div>
        <div class="settings">
          <div class="row"><span>Sync contacts</span><span class="switch on"></span></div>
          <div class="row"><span>Calendar</span><span class="switch on"></span></div>
          <div class="row"><span>Photos</span><span class="switch"></span></div>
          <div class="row"><span>Drive backup</span><span class="switch on"></span></div>
        </div>
      </div>

      <div class="panel right">
        <div class="box">
          <h4>Status Sinkronisasi</h4>
          <ul>
            <li>Last sync: 8 minutes ago</li>
            <li>Connected to 3 devices</li>
            <li>Secure with end-to-end encryption</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
