<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Settings</title>
  <style>
    :root {
      --bg: #091320;
      --panel: rgba(15,23,42,0.8);
      --card: rgba(17,24,39,0.8);
      --text: #eef8ff;
      --muted: #a1bad6;
      --line: rgba(148,163,184,0.22);
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --shadow: rgba(2,6,23,0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #040c18 0%, #020817 100%); color: var(--text); }
    .app { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .brand { font-size: 1.8rem; font-weight: 800; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a { background: rgba(15,23,42,0.8); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 0.8rem; }
    .nav a.active { background: rgba(14,116,144,0.18); border-color: rgba(125,211,252,0.6); }
    .panel { background: rgba(15,23,42,0.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 32px var(--shadow); padding: 18px; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .theme-card {
      background: rgba(17,24,39,0.8); border: 1px solid var(--line); border-radius: 14px; padding: 12px; height: 180px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .swatch { height: 100px; border-radius: 12px; }
    .theme-card strong { display: block; margin-top: 12px; }
    .theme-card small { color: var(--muted); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .button {
      background: rgba(15,23,42,0.8); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 14px; font-weight: 700;
    }
    .button.primary { background: linear-gradient(135deg, rgba(14,116,144,0.9), rgba(59,130,246,0.8)); border-color: rgba(125,211,252,0.7); }
    @media (max-width: 860px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Theme Settings</div>
      <div class="nav">
        <a href="../index.html">Home</a>
        <a href="86-account-sync.html">Sync</a>
        <a href="87-theme-settings.html" class="active">Theme</a>
        <a href="88-ringtone-settings.html">Ringtone</a>
        <a href="89-system-monitor.html">Monitor</a>
      </div>
    </div>

    <div class="panel">
      <div class="gallery">
        <div class="theme-card"><div class="swatch" style="background: linear-gradient(135deg, #7dd3fc, #0f172a);"></div><div><strong>Light Themes</strong><small>Fresh</small></div></div>
        <div class="theme-card"><div class="swatch" style="background: linear-gradient(135deg, #1d4ed8, #0f172a);"></div><div><strong>Ocean</strong><small>Calm</small></div></div>
        <div class="theme-card"><div class="swatch" style="background: linear-gradient(135deg, #8b5cf6, #111827);"></div><div><strong>Violet</strong><small>Elegant</small></div></div>
        <div class="theme-card"><div class="swatch" style="background: linear-gradient(135deg, #34d399, #052e16);"></div><div><strong>Forest</strong><small>Natural</small></div></div>
      </div>
      <div class="actions">
        <button class="button primary">Apply Theme</button>
        <button class="button">Preview</button>
        <button class="button">Custom</button>
      </div>
    </div>
  </div>
</body>
</html>
