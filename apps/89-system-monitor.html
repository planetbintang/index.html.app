<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Monitor Dashboard</title>
  <style>
    :root {
      --bg: #070d18;
      --panel: rgba(15,23,42,0.8);
      --card: rgba(17,24,39,0.82);
      --text: #edf7ff;
      --muted: #9eb2ce;
      --line: rgba(148,163,184,0.22);
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --shadow: rgba(2,6,23,0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #090d17 0%, #020817 100%); color: var(--text); }
    .app { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .brand { font-size: 1.8rem; font-weight: 800; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a { background: rgba(15,23,42,0.8); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 0.8rem; }
    .nav a.active { background: rgba(14,116,144,0.18); border-color: rgba(125,211,252,0.6); }
    .panel { background: rgba(15,23,42,0.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 30px var(--shadow); padding: 18px; }
    .grid { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 18px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .stat { background: rgba(17,24,39,0.8); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .stat strong { display: block; font-size: 1.4rem; margin-top: 8px; }
    .chart {
      height: 170px; margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(180deg, rgba(17,24,39,0.6), rgba(15,23,42,0.4)); position: relative; overflow: hidden;
    }
    .chart svg { width: 100%; height: 100%; }
    .side-list { display: grid; gap: 12px; }
    .mini { background: rgba(17,24,39,0.8); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .row { display: flex; justify-content: space-between; margin: 8px 0; color: var(--muted); }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .stat-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">System Monitor Dashboard</div>
      <div class="nav">
        <a href="../index.html">Home</a>
        <a href="88-ringtone-settings.html">Ringtone</a>
        <a href="89-system-monitor.html" class="active">Monitor</a>
        <a href="90-battery-advanced.html">Battery</a>
      </div>
    </div>

    <div class="panel">
      <div class="grid">
        <div>
          <div class="stat-grid">
            <div class="stat"><span>CPU</span><strong>42%</strong></div>
            <div class="stat"><span>Memory</span><strong>61%</strong></div>
            <div class="stat"><span>Disk</span><strong>74%</strong></div>
          </div>
          <div class="chart">
            <svg viewBox="0 0 600 170" preserveAspectRatio="none" aria-label="CPU graph">
              <path d="M0 110 C 100 95, 120 60, 180 90 S 300 140, 360 105 S 470 70, 600 55 L 600 170 L 0 170 Z" fill="rgba(125,211,252,0.15)"></path>
              <path d="M0 110 C 100 95, 120 60, 180 90 S 300 140, 360 105 S 470 70, 600 55" fill="none" stroke="#7dd3fc" stroke-width="3"></path>
            </svg>
          </div>
        </div>

        <div class="side-list">
          <div class="mini">
            <strong>Network</strong>
            <div class="row"><span>Upload</span><span>24 Mbps</span></div>
            <div class="row"><span>Download</span><span>120 Mbps</span></div>
          </div>
          <div class="mini">
            <strong>Services</strong>
            <div class="row"><span>Web</span><span>Healthy</span></div>
            <div class="row"><span>DB</span><span>Stable</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
