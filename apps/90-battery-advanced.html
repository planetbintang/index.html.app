<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battery Advanced</title>
  <style>
    :root {
      --bg: #08131f;
      --panel: rgba(15,23,42,0.8);
      --card: rgba(17,24,39,0.82);
      --text: #eef9ff;
      --muted: #a5bfd3;
      --line: rgba(148,163,184,0.22);
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --shadow: rgba(2,6,23,0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #071219, #020817 100%); color: var(--text); }
    .app { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .brand { font-size: 1.8rem; font-weight: 800; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a { background: rgba(15,23,42,0.8); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 0.8rem; }
    .nav a.active { background: rgba(14,116,144,0.18); border-color: rgba(125,211,252,0.6); }
    .panel { background: rgba(15,23,42,0.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 30px var(--shadow); padding: 18px; }
    .layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; }
    .big-battery {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(17,24,39,0.8); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 18px;
    }
    .battery {
      width: 150px; height: 72px; border-radius: 12px; border: 3px solid #7dd3fc; background: linear-gradient(90deg, rgba(52,211,153,0.7), rgba(7,153,146,0.35)); position: relative;
    }
    .battery::after { content: ''; position: absolute; right: -10px; top: 20px; width: 8px; height: 30px; border-radius: 6px; background: #7dd3fc; }
    .value { font-size: 2.6rem; font-weight: 800; }
    .list { display: grid; gap: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; background: rgba(17,24,39,0.74); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .status { width: 14px; height: 14px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 15px rgba(52,211,153,0.5); }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .big-battery { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Battery Advanced</div>
      <div class="nav">
        <a href="../index.html">Home</a>
        <a href="89-system-monitor.html">Monitor</a>
        <a href="90-battery-advanced.html" class="active">Battery</a>
      </div>
    </div>

    <div class="panel">
      <div class="layout">
        <div>
          <div class="big-battery">
            <div>
              <div class="muted">Battery Level</div>
              <div class="value">87%</div>
            </div>
            <div class="battery"></div>
          </div>
          <div class="list">
            <div class="row"><span>Battery Saver</span><span class="status"></span></div>
            <div class="row"><span>Adaptive Battery</span><span>On</span></div>
            <div class="row"><span>Charging</span><span>Fast</span></div>
            <div class="row"><span>Health</span><span>96%</span></div>
          </div>
        </div>

        <div class="list">
          <div class="row"><span>Power Plan</span><span>Balanced</span></div>
          <div class="row"><span>Battery Temperature</span><span>32°C</span></div>
          <div class="row"><span>Screen Timeout</span><span>15 min</span></div>
          <div class="row"><span>Optimized Charging</span><span>On</span></div>
          <div class="row"><span>Fast Startup</span><span>Off</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
