<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppHub Advanced Launcher</title>
    <style>
      :root {
        --bg: #020817;
        --card: rgba(15, 23, 42, 0.9);
        --line: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #7dd3fc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(56,189,248,0.2), transparent 30%), linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        padding: 24px;
      }
      .container { max-width: 1280px; margin: 0 auto; }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .brand { font-size: clamp(1.6rem, 2vw, 2.6rem); font-weight: 800; }
      .brand span { color: var(--accent); }
      .status { border: 1px solid var(--line); background: rgba(15,23,42,0.7); border-radius: 999px; padding: 8px 12px; color: var(--muted); }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: 120px;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      a { color: inherit; text-decoration: none; }
      .icon { font-size: 1.8rem; }
      .name { font-weight: 700; margin-top: 8px; }
      .tag { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">APPHUB <span>ADVANCED</span></div>
        <div class="status">Runtime ready</div>
      </div>
      <div class="grid" id="launcher"></div>
    </div>
    <script>
      const apps = [
        { name: 'Binary', path: '41-binary.html', icon: '💾' },
        { name: 'URL Builder', path: '42-url-builder.html', icon: '🔗' },
        { name: 'Hash', path: '43-hash-generator.html', icon: '🔐' },
        { name: 'DNS', path: '44-dns-lookup.html', icon: '🌐' },
        { name: 'CSV', path: '45-csv-cleaner.html', icon: '📄' },
        { name: 'Regex', path: '46-regex-tester.html', icon: '🧬' },
        { name: 'Search', path: '47-search-index.html', icon: '🔎' },
        { name: 'QR', path: '48-qr-reader.html', icon: '📷' },
        { name: 'Base64', path: '49-image-base64.html', icon: '🧩' },
        { name: 'Merge', path: '50-file-merge.html', icon: '🔀' },
        { name: 'Diff', path: '51-text-diff.html', icon: '🧪' },
        { name: 'Case', path: '52-case-converter.html', icon: '✍️' },
        { name: 'Lorem', path: '53-lorem-generator.html', icon: '📚' },
        { name: 'SVG', path: '54-svg-mini.html', icon: '🎨' },
        { name: 'Markdown', path: '55-markdown-preview.html', icon: '📝' },
        { name: 'YAML', path: '56-yaml-json.html', icon: '🧱' },
        { name: 'RSS', path: '57-rss-reader.html', icon: '📡' },
        { name: 'IP', path: '58-ip-calculator.html', icon: '🛰️' },
        { name: 'Password', path: '59-password-meter.html', icon: '🔒' },
        { name: 'Card', path: '60-credit-mask.html', icon: '💳' },
        { name: 'Sort', path: '61-sorting-visualizer.html', icon: '📊' },
        { name: 'Palette', path: '62-color-palette.html', icon: '🎯' },
        { name: 'Template', path: '63-template-builder.html', icon: '🧰' },
        { name: 'Noise', path: '64-noise-generator.html', icon: '📈' },
        { name: 'Barcode', path: '65-barcode-mock.html', icon: '📦' },
        { name: 'Sitemap', path: '66-sitemap-builder.html', icon: '🗺️' },
        { name: 'Number', path: '67-number-format.html', icon: '💹' },
        { name: 'Browser', path: '68-browser-info.html', icon: '🖥️' },
        { name: 'Locale', path: '69-locale-clock.html', icon: '⏰' },
        { name: 'Notes', path: '70-sticky-notes.html', icon: '📌' },
        { name: 'Keyboard', path: '71-keyboard-tester.html', icon: '⌨️' },
        { name: 'Capture', path: '72-screen-capture.html', icon: '📸' },
        { name: 'Table', path: '73-data-table.html', icon: '📋' },
        { name: 'Facts', path: '74-random-facts.html', icon: '💡' },
        { name: 'Bytes', path: '75-byte-counter.html', icon: '📏' },
        { name: 'Health', path: '76-health-tracker.html', icon: '💪' },
        { name: 'Sensor', path: '77-sensor-simulator.html', icon: '🌡️' },
        { name: 'Budget', path: '78-budget-planner.html', icon: '💰' },
        { name: 'Voice', path: '79-voice-assistant.html', icon: '🎙️' },
        { name: 'Queue', path: '80-work-queue.html', icon: '🧾' }
      ];
      const launcher = document.getElementById('launcher');
      apps.forEach(app => {
        const link = document.createElement('a');
        link.href = app.path;
        link.className = 'card';
        link.innerHTML = `
          <div>
            <div class="icon">${app.icon}</div>
            <div class="name">${app.name}</div>
          </div>
          <div class="tag">run</div>
        `;
        launcher.appendChild(link);
      });
    </script>
  </body>
</html>
