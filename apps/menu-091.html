<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu 091</title>
  <style>
    :root {
      --bg: #07111d;
      --panel: rgba(15,23,42,0.82);
      --card: rgba(17,24,39,0.86);
      --text: #edf7ff;
      --muted: #99afc9;
      --line: rgba(148,163,184,0.22);
      --accent: #7dd3fc;
      --accent-2: #34d399;
      --shadow: rgba(2,6,23,0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #07111d 0%, #020817 100%); color: var(--text); }
    .app { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .brand { font-size: 1.8rem; font-weight: 800; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a { background: rgba(15,23,42,0.8); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; text-decoration: none; }
    .nav a.active { background: rgba(14,116,144,0.18); border-color: rgba(125,211,252,0.6); }
    .panel { background: rgba(15,23,42,0.82); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 30px var(--shadow); padding: 18px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { background: rgba(17,24,39,0.78); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
    .card h2 { margin: 0 0 12px; font-size: 1.5rem; }
    .card p { color: var(--muted); margin: 0 0 18px; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .button { border: 1px solid var(--line); background: rgba(15,23,42,0.8); color: var(--text); border-radius: 10px; padding: 9px 14px; font-weight: 700; }
    .button.primary { background: linear-gradient(135deg, rgba(14,116,144,0.8), rgba(59,130,246,0.8)); border-color: rgba(125,211,252,0.8); }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Menu 091</div>
      <div class="nav">
        <a href="../index.html">Home</a>
        <a href="../index.html">Prev</a>
        <a href="menu-092.html" class="active">Next</a>
      </div>
    </div>

    <div class="panel">
      <div class="grid">
        <div class="card">
          <h2>Menu 091</h2>
          <p>System dashboard panel for launch area 91.</p>
          <div class="button-row"><button class="button primary">Open</button><button class="button">Config</button></div>
        </div>
        <div class="card">
          <h2>Status</h2>
          <p>Connected and ready.</p>
          <div class="button-row"><button class="button">Sync</button><button class="button">Save</button></div>
        </div>
        <div class="card">
          <h2>Quick Actions</h2>
          <p>Open, copy, export, and share.</p>
          <div class="button-row"><button class="button">Copy</button><button class="button">Share</button></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
