<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Browser</title>
    <style>
      :root {
        --bg: #09111d;
        --panel: rgba(15, 23, 42, 0.9);
        --toolbar: rgba(15, 23, 42, 0.96);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #7dd3fc;
        --accent-2: #34d399;
        --border: rgba(148, 163, 184, 0.22);
        --shadow: rgba(2, 6, 23, 0.65);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, var(--bg) 0%, #0f172a 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .browser-shell {
        width: min(100%, 1500px);
        height: min(92vh, 980px);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 50px var(--shadow);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: var(--toolbar);
        border-bottom: 1px solid var(--border);
      }

      .traffic {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .traffic span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }

      .traffic .red { background: #f87171; }
      .traffic .yellow { background: #fbbf24; }
      .traffic .green { background: #34d399; }

      .nav-buttons {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 8px;
      }

      button {
        border: 1px solid var(--border);
        background: rgba(30, 41, 59, 0.75);
        color: var(--text);
        padding: 9px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        border-color: rgba(125, 211, 252, 0.8);
        transform: translateY(-1px);
      }

      .address-bar {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 9px 14px;
        min-width: 0;
      }

      .lock {
        color: var(--accent);
        font-size: 0.95rem;
      }

      .address-input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: rgba(15, 23, 42, 0.7);
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.8rem;
      }

      .status-tag {
        color: var(--accent-2);
        font-weight: 700;
      }

      .frame-wrap {
        position: relative;
        width: 100%;
        height: calc(100% - 96px);
        background: #fff;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
        display: block;
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        background: rgba(15, 23, 42, 0.95);
        color: var(--text);
      }

      .fallback.show {
        display: flex;
      }

      .fallback-box {
        max-width: 560px;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 26px 22px;
      }

      .fallback h2 {
        margin: 0 0 10px;
        font-size: clamp(1.2rem, 2vw, 1.8rem);
      }

      .fallback p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }

      .fallback a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        body { padding: 12px; }
        .toolbar { gap: 8px; padding: 10px 12px; }
        .nav-buttons { display: none; }
        .actions button:nth-child(2) { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="browser-shell" role="application" aria-label="GitHub browser">
      <div class="toolbar">
        <div class="traffic" aria-hidden="true">
          <span class="red"></span>
          <span class="yellow"></span>
          <span class="green"></span>
        </div>

        <div class="nav-buttons">
          <button id="backBtn" type="button" aria-label="Kembali">←</button>
          <button id="forwardBtn" type="button" aria-label="Maju">→</button>
          <button id="reloadBtn" type="button" aria-label="Muat ulang">↻</button>
        </div>

        <div class="address-bar">
          <span class="lock">🔒</span>
          <input id="addressInput" class="address-input" type="text" value="https://github.com" aria-label="URL browser" />
        </div>

        <div class="actions">
          <button id="goBtn" type="button">Go</button>
          <button id="openBtn" type="button">Open</button>
        </div>
      </div>

      <div class="status-bar">
        <span>GitHub Browser</span>
        <span class="status-tag">online</span>
      </div>

      <div class="frame-wrap">
        <iframe
          id="browserFrame"
          title="GitHub browser"
          src="https://r.jina.ai/http://github.com"
          referrerpolicy="no-referrer-when-downgrade"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
        ></iframe>

        <div id="fallback" class="fallback" aria-live="polite">
          <div class="fallback-box">
            <h2>Konten GitHub diblokir oleh browser</h2>
            <p>Browser ini sedang menampilkan halaman dalam iframe, tetapi GitHub memblokir embed langsung dari situs lain. Anda tetap bisa membuka GitHub di tab baru.</p>
            <p><a id="fallbackLink" href="https://github.com" target="_blank" rel="noopener noreferrer">Buka GitHub di tab baru</a></p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const browserFrame = document.getElementById('browserFrame');
      const addressInput = document.getElementById('addressInput');
      const fallback = document.getElementById('fallback');
      const backBtn = document.getElementById('backBtn');
      const forwardBtn = document.getElementById('forwardBtn');
      const reloadBtn = document.getElementById('reloadBtn');
      const goBtn = document.getElementById('goBtn');
      const openBtn = document.getElementById('openBtn');

      const DEFAULT_URL = 'https://github.com';
      const PROXY_PREFIX = 'https://r.jina.ai/http://';

      function normalizeUrl(raw) {
        const value = String(raw || '').trim();
        if (!value) return DEFAULT_URL;
        if (/^https?:\/\//i.test(value)) return value;
        if (value.includes('.')) return 'https://' + value;
        return 'https://www.google.com/search?q=' + encodeURIComponent(value);
      }

      function toProxyUrl(url) {
        const normalized = normalizeUrl(url);
        if (/^https?:\/\//i.test(normalized)) {
          return PROXY_PREFIX + normalized.replace(/^https?:\/\//i, '');
        }
        return PROXY_PREFIX + 'github.com';
      }

      function loadUrl(url) {
        const normalized = normalizeUrl(url);
        addressInput.value = normalized;
        browserFrame.src = toProxyUrl(normalized);
        fallback.classList.remove('show');
      }

      function detectBlock() {
        try {
          const href = browserFrame.contentWindow.location.href;
          if (href && href.includes('github.com') || href.includes('r.jina.ai')) {
            fallback.classList.remove('show');
            return;
          }
        } catch (err) {
          fallback.classList.add('show');
        }
      }

      backBtn.addEventListener('click', () => {
        try { browserFrame.contentWindow.history.back(); } catch (err) { loadUrl(DEFAULT_URL); }
      });

      forwardBtn.addEventListener('click', () => {
        try { browserFrame.contentWindow.history.forward(); } catch (err) { loadUrl(DEFAULT_URL); }
      });

      reloadBtn.addEventListener('click', () => {
        try { browserFrame.contentWindow.location.reload(); } catch (err) { loadUrl(DEFAULT_URL); }
      });

      goBtn.addEventListener('click', () => {
        loadUrl(addressInput.value);
      });

      openBtn.addEventListener('click', () => {
        const target = addressInput.value || DEFAULT_URL;
        window.open(normalizeUrl(target), '_blank', 'noopener,noreferrer');
      });

      addressInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          loadUrl(addressInput.value);
        }
      });

      browserFrame.addEventListener('load', detectBlock);
      loadUrl(DEFAULT_URL);
    </script>
  </body>
</html>
