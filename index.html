<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=https://github.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to GitHub</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #111827;
        --panel: rgba(15, 23, 42, 0.86);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #7dd3fc;
        --border: rgba(148, 163, 184, 0.2);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #0b1020 0%, #0f172a 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        width: min(100%, 560px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      }
      .title {
        font-size: clamp(1.5rem, 2vw, 2.1rem);
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
        margin: 0 0 18px;
        line-height: 1.6;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        margin: 0 auto 18px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="title">Mengarahkan ke GitHub</h1>
      <p class="muted">Halaman ini akan dibawa ke <strong>https://github.com</strong> secara otomatis.</p>
      <p><a href="https://github.com" target="_blank" rel="noopener noreferrer">Klik di sini jika tidak otomatis terbuka</a></p>
    </div>

    <script>
      window.location.replace('https://github.com');
    </script>
  </body>
</html>
