<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Browser</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #111827;
        --panel: rgba(15, 23, 42, 0.9);
        --toolbar: rgba(15, 23, 42, 0.96);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #7dd3fc;
        --border: rgba(148, 163, 184, 0.22);
        --shadow: rgba(2, 6, 23, 0.6);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, #0b1020 0%, #0f172a 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .browser {
        width: min(100%, 1500px);
        height: min(92vh, 980px);
        background: rgba(15, 23, 42, 0.86);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 50px var(--shadow);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--toolbar);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
      }

      .traffic {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .traffic span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }

      .traffic .red { background: #f87171; }
      .traffic .yellow { background: #fbbf24; }
      .traffic .green { background: #34d399; }

      .address {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        padding: 9px 14px;
        min-width: 0;
      }

      .lock {
        color: var(--accent);
        font-weight: 700;
      }

      .address-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.96rem;
      }

      .browser-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button {
        border: 1px solid var(--border);
        background: rgba(30, 41, 59, 0.8);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 12px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        border-color: rgba(125, 211, 252, 0.8);
        transform: translateY(-1px);
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        background: rgba(15, 23, 42, 0.72);
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.02em;
      }

      .status .tag {
        color: var(--accent);
        font-weight: 700;
      }

      iframe {
        width: 100%;
        height: calc(100% - 110px);
        border: 0;
        background: white;
        display: block;
      }

      .fallback {
        display: none;
        padding: 18px 16px;
        color: var(--text);
        background: rgba(15, 23, 42, 0.8);
        border-top: 1px solid var(--border);
      }

      .fallback.show {
        display: block;
      }

      .fallback a {
        color: var(--accent);
      }

      @media (max-width: 720px) {
        body { padding: 12px; }
        .toolbar { gap: 8px; padding: 10px 12px; }
        button { padding: 8px 10px; }
        .browser-actions button:nth-child(2) { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="browser" role="application" aria-label="GitHub browser">
      <div class="toolbar">
        <div class="traffic" aria-hidden="true">
          <span class="red"></span>
          <span class="yellow"></span>
          <span class="green"></span>
        </div>

        <div class="address" aria-label="Alamat situs">
          <span class="lock">🔒</span>
          <span class="address-text" id="addressText">https://github.com</span>
        </div>

        <div class="browser-actions">
          <button id="reloadBtn" type="button">Refresh</button>
          <button id="openBtn" type="button">Open</button>
        </div>
      </div>

      <div class="status">
        <span>GitHub Browser</span>
        <span class="tag">online</span>
      </div>

      <iframe id="browserFrame" src="https://github.com" title="GitHub browser" loading="lazy"></iframe>

      <div class="fallback" id="fallbackBox">
        Embedding GitHub diblokir oleh browser. <a href="https://github.com" target="_blank" rel="noopener noreferrer">Buka GitHub di tab baru</a>
      </div>
    </div>

    <script>
      const addressText = document.getElementById('addressText');
      const browserFrame = document.getElementById('browserFrame');
      const reloadBtn = document.getElementById('reloadBtn');
      const openBtn = document.getElementById('openBtn');
      const fallbackBox = document.getElementById('fallbackBox');
      const targetUrl = 'https://github.com';

      function setAddress(url) {
        try {
          const value = new URL(url).href;
          addressText.textContent = value;
        } catch {
          addressText.textContent = url;
        }
      }

      function loadGithub() {
        browserFrame.src = targetUrl;
        setAddress(targetUrl);
        fallbackBox.classList.remove('show');
      }

      reloadBtn.addEventListener('click', loadGithub);
      openBtn.addEventListener('click', () => {
        window.open(targetUrl, '_blank', 'noopener,noreferrer');
      });

      browserFrame.addEventListener('load', () => {
        try {
          const href = browserFrame.contentWindow.location.href;
          setAddress(href);
          fallbackBox.classList.remove('show');
        } catch (error) {
          fallbackBox.classList.add('show');
        }
      });

      loadGithub();
    </script>
  </body>
</html>
